<title>Журкин: учёт рейсов</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Cormorant+SC:wght@600;700&family=Unbounded:wght@600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: one narrow column like a driver's logbook; summary "приборка" on top, рейсы below, fixed action bar at the bottom. */
:root{
  --bg:#eef0ec; --surface:#fbfcf9; --ink:#1c211e; --muted:#5f6a63; --line:#d3d9d2;
  --accent:#c9902a; --accent-ink:#1b1204; --good:#1f7a4a; --bad:#b23a2a;
  --font-display:"Unbounded","Onest",system-ui,sans-serif;
  --font-body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --crest-navy:#13234a; --crest-red:#b8193a; --gold-1:#f6d27a; --gold-2:#c9902a; --font-crest:"Cormorant SC","Cormorant Garamond",Georgia,serif;
  --font-num:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141716; --surface:#1d2120; --ink:#e8ece7; --muted:#9aa59e; --line:#323937;
  --accent:#e3b04b; --accent-ink:#1b1204; --good:#4cc283; --bad:#ef7a66; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141716; --surface:#1d2120; --ink:#e8ece7; --muted:#9aa59e; --line:#323937;
  --accent:#e3b04b; --accent-ink:#1b1204; --good:#4cc283; --bad:#ef7a66; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 110px}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1{font:700 1.15rem/1.2 var(--font-display);margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font:600 .78rem/1 var(--font-body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 10px}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.brand{position:relative;display:flex;align-items:center;gap:14px;background:radial-gradient(120% 140% at 0% 0%,#22396f 0%,var(--crest-navy) 55%,#0b1530 100%);border-radius:18px;padding:14px 16px 14px 10px;overflow:hidden;border:1px solid #2c4277}
.brand::after{content:"";position:absolute;inset:auto 0 0 0;height:3px;background:linear-gradient(90deg,var(--crest-red),var(--gold-2),var(--crest-red))}
.brand img{width:84px;height:auto;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.45))}
.brand .t{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand .name{font:700 clamp(2rem,9vw,2.6rem)/1 var(--font-crest);letter-spacing:.08em;background:linear-gradient(180deg,var(--gold-1) 10%,var(--gold-2) 90%);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 1px 0 rgba(0,0,0,.15)}
.brand .sub{color:#c9d3ec;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase}
.brand .rule{display:flex;align-items:center;gap:8px;color:var(--gold-2);font-size:.7rem}
.brand .rule::before,.brand .rule::after{content:"";height:1px;flex:1;max-width:60px;background:currentColor;opacity:.6}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.month{display:flex;align-items:center;gap:6px}
.month button{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:var(--surface)}
.month span{min-width:118px;text-align:center;font-weight:600}
.note{font-size:.82rem;color:var(--muted)}
.warn{font-size:.82rem;background:color-mix(in srgb,var(--accent) 18%,var(--surface));border:1px solid color-mix(in srgb,var(--accent) 50%,var(--line));padding:8px 10px;border-radius:10px}

.dash{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.profit{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.profit .big{font:700 2rem/1 var(--font-num);font-variant-numeric:tabular-nums}
.profit .lbl{color:var(--muted);font-size:.85rem}
.grid4{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px 16px}
.kv{display:flex;flex-direction:column;gap:2px;min-width:0}
.kv b{font:700 1rem var(--font-num);font-variant-numeric:tabular-nums}
.kv small{color:var(--muted);font-size:.78rem}
.bars{display:flex;flex-direction:column;gap:6px}
.bar{display:grid;grid-template-columns:110px 1fr 84px;gap:8px;align-items:center;font-size:.84rem}
.bar .track{height:8px;border-radius:4px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden}
.bar .fill{height:100%;background:var(--accent)}
.bar .v{text-align:right}
.limit .track{height:6px;border-radius:3px;background:color-mix(in srgb,var(--ink) 8%,transparent);overflow:hidden;margin-top:6px}
.limit .fill{height:100%;background:var(--good)}
.limit.hot .fill{background:var(--bad)}

.trips{display:flex;flex-direction:column;gap:10px}
.trip{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;width:100%}
.trip .r{font-weight:600;min-width:0;overflow-wrap:anywhere}
.trip .p{font:700 1rem var(--font-num);text-align:right}
.trip .m{color:var(--muted);font-size:.8rem}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tag{display:inline-block;font-size:.7rem;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--muted);margin-left:6px;vertical-align:1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;display:flex;flex-direction:column;gap:10px;align-items:center}

.actionbar{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;justify-content:center}
.btn{border:0;border-radius:12px;padding:12px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.actionbar .btn{width:100%;max-width:560px;font-size:1rem}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--surface);width:100%;max-width:600px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;
  padding:18px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.panel header{display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:transparent;font-size:1.5rem;line-height:1;padding:4px 8px;color:var(--muted)}
form{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
label{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);min-width:0}
input,select,textarea{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:1rem;width:100%;min-width:0}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:7px 12px;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.calc{border-top:1px solid var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px;font-size:.9rem}
.calc div{display:flex;justify-content:space-between;gap:10px}
.calc .tot{font-weight:700;font-size:1.05rem;border-top:1px dashed var(--line);padding-top:6px}
.exps{display:flex;flex-direction:column;gap:6px}
.exp{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:.9rem}
.exp .del{border:0;background:transparent;color:var(--muted);font-size:1.1rem;padding:2px 6px}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btns .btn{flex:1}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>

const NPD_LIMIT=2400000;
const rub=n=>(Math.round(n)||0).toLocaleString("ru-RU")+" ₽";
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const MONTHS=["Январь","Февраль","Март","Апрель","Май","Июнь","Июль","Август","Сентябрь","Октябрь","Ноябрь","Декабрь"];

let docs={};           // id -> body
let cur=new Date(); cur.setDate(1);
let col=null;          // db collection or null
let mode="local";

/* ---------- storage ---------- */
function loadLocal(){try{docs=JSON.parse(localStorage.getItem("gazel-uchet")||"{}")}catch(e){docs={}}}
function saveLocal(){try{localStorage.setItem("gazel-uchet",JSON.stringify(docs))}catch(e){}}
async function put(id,body){
  docs[id]=body; render();
  if(mode==="db"){try{await col.doc(id).set(body)}catch(e){note("Не удалось сохранить: "+(e.message||e.code)+". Проверьте интернет и повторите.")}}
  else saveLocal();
}
async function del(id){
  delete docs[id]; render();
  if(mode==="db"){try{await col.doc(id).delete()}catch(e){note("Не удалось удалить: "+(e.message||e.code))}}
  else saveLocal();
}
function note(t){const n=document.getElementById("storeNote");n.textContent=t;n.hidden=!t}

const IS_APP=!!window.AndroidApp||location.protocol==="file:";
async function initStore(){
  loadLocal(); render();
  if(IS_APP)return;
  try{
    const [db,user]=await Promise.all([window.claude?.use?.("db"),window.claude?.use?.("user")]);
    if(!db||!user){note("Записи хранятся только в этом браузере. Откройте страницу, войдя в Claude, чтобы они сохранялись в аккаунте и были доступны с любого устройства.");return}
    const id=await user.id();
    col=db.collection("data/users/"+id);
    const t=setTimeout(()=>note("Облако отвечает медленно, показываю записи из этого браузера."),10000);
    col.onSnapshot(snap=>{
      clearTimeout(t);
      const local=docs; docs={};
      snap.docs.forEach(d=>docs[d.id]=d.data());
      // one-time move of records made offline in this browser
      if(mode!=="db"){mode="db";note("");
        Object.entries(local).forEach(([k,v])=>{if(!docs[k]){docs[k]=v;col.doc(k).set(v).catch(()=>{})}});
        try{localStorage.removeItem("gazel-uchet")}catch(e){}
      }
      render();
    },e=>{clearTimeout(t);mode="local";note("Нет связи с облаком ("+e.code+"). Записи сохраняются в этом браузере.")});
  }catch(e){note("Записи хранятся только в этом браузере.")}
}

/* ---------- calc ---------- */
const settings=()=>docs.settings||{amortPerKm:5};
function tripCalc(tid){
  const t=docs[tid]; const ex=Object.entries(docs).filter(([,d])=>d.kind==="exp"&&d.tripId===tid);
  const exp=ex.reduce((s,[,d])=>s+(+d.amount||0),0);
  const tax=(+t.pay||0)*(t.client==="jur"?0.06:0.04);
  const am=(+t.km||0)*(+settings().amortPerKm||0);
  const profit=(+t.pay||0)-tax-exp-am;
  const liters=ex.reduce((s,[,d])=>s+(d.cat==="fuel"?(+d.liters||0):0),0);
  return {ex,exp,tax,am,profit,liters};
}
const ym=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");

/* ---------- render ---------- */
function render(){
  document.getElementById("mLabel").textContent=MONTHS[cur.getMonth()]+" "+cur.getFullYear();
  document.getElementById("amortVal").textContent=settings().amortPerKm;
  const key=ym(cur);
  const trips=Object.entries(docs).filter(([,d])=>d.kind==="trip"&&(d.date||"").startsWith(key)).sort((a,b)=>b[1].date.localeCompare(a[1].date));
  let pay=0,exp=0,tax=0,am=0,km=0,lit=0,fuelKm=0; const byCat={};
  const list=document.getElementById("trips");
  list.innerHTML="";
  trips.forEach(([id,t])=>{
    const c=tripCalc(id); pay+=+t.pay||0; exp+=c.exp; tax+=c.tax; am+=c.am; km+=+t.km||0;
    if(c.liters){lit+=c.liters;fuelKm+=+t.km||0}
    c.ex.forEach(([,d])=>byCat[d.cat]=(byCat[d.cat]||0)+(+d.amount||0));
    const b=document.createElement("button");b.className="trip";
    b.innerHTML=`<div class="r">${esc(t.route||"Без маршрута")}${t.example?'<span class="tag">пример</span>':""}</div>
      <div class="p num ${c.profit>=0?"pos":"neg"}">${rub(c.profit)}</div>
      <div class="m">${new Date(t.date).toLocaleDateString("ru-RU",{day:"numeric",month:"short"})} · <span class="num">${(+t.km||0).toLocaleString("ru-RU")}</span> км · ${t.client==="jur"?"юрлицо/ИП":"физлицо"}</div>
      <div class="m num" style="text-align:right">оплата ${rub(t.pay)}</div>`;
    b.onclick=()=>openTrip(id);
    list.appendChild(b);
  });
  if(!trips.length){
    list.innerHTML=`<div class="empty"><div><b>В этом месяце рейсов нет</b></div><div class="note">Добавьте рейс: сумму от клиента и пробег. Потом в карточке рейса записывайте каждую трату: заправку, платную дорогу, обед.</div><button class="btn ghost" id="demo">Показать пример рейса</button></div>`;
    document.getElementById("demo").onclick=addDemo;
  }
  const profit=pay-exp-tax-am;
  const pEl=document.getElementById("sProfit");pEl.textContent=rub(profit);pEl.className="big "+(profit>=0?"pos":"neg");
  document.getElementById("sPay").textContent=rub(pay);
  document.getElementById("sExp").textContent=rub(exp);
  document.getElementById("sTax").textContent=rub(tax);
  document.getElementById("sAm").textContent=rub(am);
  document.getElementById("sTrips").textContent=trips.length+" / "+km.toLocaleString("ru-RU")+" км";
  document.getElementById("sFuel").textContent=fuelKm?(lit/fuelKm*100).toFixed(1):"—";
  document.getElementById("sPerKm").innerHTML=km?`<span class="num">${(profit/km).toFixed(1)}</span> ₽ чистыми с 1 км<br><span class="num">${(pay/km).toFixed(1)}</span> ₽/км ставка`:"";
  const bars=document.getElementById("bars"); const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]); const mx=Math.max(1,...cats.map(c=>c[1]));
  bars.innerHTML=cats.length?cats.map(([c,v])=>`<div class="bar"><span>${CATN[c]||c}</span><div class="track"><div class="fill" style="width:${v/mx*100}%"></div></div><span class="v num">${rub(v)}</span></div>`).join(""):'<div class="note">Трат пока нет.</div>';
  // year limit
  const y=String(cur.getFullYear());
  const yPay=Object.values(docs).filter(d=>d.kind==="trip"&&!d.example&&(d.date||"").startsWith(y)).reduce((s,d)=>s+(+d.pay||0),0);
  const pct=Math.min(100,yPay/NPD_LIMIT*100);
  document.getElementById("limitTxt").innerHTML=`Лимит самозанятого за ${y} год: <span class="num">${rub(yPay)}</span> из <span class="num">${rub(NPD_LIMIT)}</span> (${pct.toFixed(0)}%)`;
  document.getElementById("limitFill").style.width=pct+"%";
  document.getElementById("limitBox").classList.toggle("hot",pct>=85);
}

/* ---------- sheets ---------- */
const sheet=document.getElementById("sheet"), panel=document.getElementById("panel");
function openSheet(html){panel.innerHTML=html;sheet.hidden=false;panel.querySelector(".x").onclick=closeSheet}
function closeSheet(){sheet.hidden=true;panel.innerHTML=""}
sheet.addEventListener("click",e=>{if(e.target===sheet)closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!sheet.hidden)closeSheet()});

function tripForm(id){
  const t=id?docs[id]:{date:today(),client:"jur",route:"",pay:"",km:""};
  openSheet(`<header><h1>${id?"Рейс":"Новый рейс"}</h1><button class="x" aria-label="Закрыть">×</button></header>
  <form id="tf">
    <label>Маршрут<input id="f-route" required placeholder="Омск — Новосибирск" value="${esc(t.route)}"></label>
    <div class="row"><label>Дата<input id="f-date" type="date" required value="${esc(t.date)}"></label>
    <label>Пробег, км<input id="f-km" type="number" inputmode="decimal" min="0" step="1" value="${esc(t.km)}" placeholder="650"></label></div>
    <label>Оплата от клиента, ₽<input id="f-pay" type="number" inputmode="decimal" min="0" step="1" required value="${esc(t.pay)}" placeholder="24000"></label>
    <div><div class="note" style="margin-bottom:6px">Кто платит (налог)</div><div class="seg" id="f-client">
      <button type="button" data-v="jur" aria-pressed="${t.client==="jur"}">Юрлицо или ИП · 6%</button>
      <button type="button" data-v="fiz" aria-pressed="${t.client!=="jur"}">Физлицо · 4%</button></div></div>
    <label>Заметка<input id="f-note" value="${esc(t.note)}" placeholder="Груз, клиент, площадка"></label>
    <div class="btns"><button class="btn" type="submit">${id?"Сохранить":"Добавить рейс"}</button>${id?'<button class="btn danger" type="button" id="f-del">Удалить рейс</button>':""}</div>
    <div class="note" id="f-confirm" hidden></div>
  </form>`);
  let client=t.client||"jur";
  panel.querySelectorAll("#f-client button").forEach(b=>b.onclick=()=>{client=b.dataset.v;panel.querySelectorAll("#f-client button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  panel.querySelector("#tf").onsubmit=e=>{e.preventDefault();
    const nid=id||uid();
    put(nid,{...(id?docs[id]:{}),kind:"trip",route:panel.querySelector("#f-route").value.trim(),date:panel.querySelector("#f-date").value,
      km:+panel.querySelector("#f-km").value||0,pay:+panel.querySelector("#f-pay").value||0,client,note:panel.querySelector("#f-note").value.trim(),createdAt:(id?docs[id].createdAt:Date.now())});
    const d=new Date(panel.querySelector("#f-date").value);cur=new Date(d.getFullYear(),d.getMonth(),1);render();
    openTrip(nid);
  };
  const delB=panel.querySelector("#f-del");
  if(delB)delB.onclick=()=>{
    if(delB.dataset.sure){Object.entries(docs).forEach(([k,d])=>{if(d.kind==="exp"&&d.tripId===id)del(k)});del(id);closeSheet();return}
    delB.dataset.sure=1;delB.textContent="Точно удалить вместе с тратами?";
  };
}

function openTrip(id){
  const t=docs[id]; if(!t){closeSheet();return}
  const c=tripCalc(id);
  openSheet(`<header><div><h1>${esc(t.route)}</h1><div class="note">${new Date(t.date).toLocaleDateString("ru-RU",{day:"numeric",month:"long"})} · <span class="num">${t.km}</span> км${t.note?" · "+esc(t.note):""}</div></div><button class="x" aria-label="Закрыть">×</button></header>
  <form id="ef">
    <h2 style="margin:0">Записать трату</h2>
    <div class="seg" id="e-cat">${CATS.map(([k,n],i)=>`<button type="button" data-v="${k}" aria-pressed="${i===0}">${n}</button>`).join("")}</div>
    <div class="row"><label>Сумма, ₽<input id="e-amount" type="number" inputmode="decimal" min="0" step="1" required placeholder="3500"></label>
    <label id="e-litersL">Литров<input id="e-liters" type="number" inputmode="decimal" min="0" step="0.1" placeholder="50"></label></div>
    <label>Комментарий<input id="e-note" placeholder="АЗС, точка, что купили"></label>
    <button class="btn" type="submit">Записать</button>
  </form>
  <div><h2>Траты рейса</h2><div class="exps">${c.ex.length?c.ex.sort((a,b)=>(a[1].createdAt||0)-(b[1].createdAt||0)).map(([k,d])=>`<div class="exp"><span>${CATN[d.cat]||d.cat}${d.liters?` · <span class="num">${d.liters}</span> л`:""}${d.note?`<br><span class="note">${esc(d.note)}</span>`:""}</span><span class="num">${rub(d.amount)}</span><button class="del" data-id="${k}" aria-label="Удалить трату">×</button></div>`).join(""):'<div class="note">Пока ничего не записано.</div>'}</div></div>
  <div class="calc">
    <div><span>Оплата</span><span class="num">${rub(t.pay)}</span></div>
    <div><span>Налог НПД ${t.client==="jur"?"6%":"4%"}</span><span class="num">− ${rub(c.tax)}</span></div>
    <div><span>Траты в рейсе</span><span class="num">− ${rub(c.exp)}</span></div>
    <div><span>Износ (${settings().amortPerKm} ₽/км)</span><span class="num">− ${rub(c.am)}</span></div>
    <div class="tot"><span>Чистыми</span><span class="num ${c.profit>=0?"pos":"neg"}">${rub(c.profit)}</span></div>
    ${t.km?`<div class="note"><span>С 1 км: <span class="num">${(c.profit/t.km).toFixed(1)}</span> ₽${c.liters?` · расход <span class="num">${(c.liters/t.km*100).toFixed(1)}</span> л/100 км`:""}</span></div>`:""}
  </div>
  <div class="btns"><button class="btn ghost" type="button" id="editT">Изменить рейс</button></div>`);
  let cat="fuel";
  const litL=panel.querySelector("#e-litersL");
  panel.querySelectorAll("#e-cat button").forEach(b=>b.onclick=()=>{cat=b.dataset.v;litL.hidden=cat!=="fuel";panel.querySelectorAll("#e-cat button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  panel.querySelector("#ef").onsubmit=e=>{e.preventDefault();
    put(uid(),{kind:"exp",tripId:id,cat,amount:+panel.querySelector("#e-amount").value||0,liters:cat==="fuel"?(+panel.querySelector("#e-liters").value||0):0,note:panel.querySelector("#e-note").value.trim(),createdAt:Date.now()});
    openTrip(id);
  };
  panel.querySelectorAll(".del").forEach(b=>b.onclick=()=>{del(b.dataset.id);openTrip(id)});
  panel.querySelector("#editT").onclick=()=>tripForm(id);
}

function settingsForm(){
  openSheet(`<header><h1>Износ машины</h1><button class="x" aria-label="Закрыть">×</button></header>
  <form id="sf"><div class="note">Сколько рублей с каждого километра откладывать на ТО, масло, резину, ремонт и будущую замену машины. Для Газели обычно закладывают 4–8 ₽/км; подберите по своим чекам.</div>
  <label>₽ на 1 км<input id="s-am" type="number" inputmode="decimal" min="0" step="0.5" value="${settings().amortPerKm}"></label>
  <button class="btn" type="submit">Сохранить</button></form>`);
  panel.querySelector("#sf").onsubmit=e=>{e.preventDefault();put("settings",{kind:"settings",amortPerKm:+panel.querySelector("#s-am").value||0});closeSheet()};
}

function addDemo(){
  const id=uid(), d=ym(cur)+"-"+String(Math.min(15,new Date().getDate())).padStart(2,"0");
  put(id,{kind:"trip",example:true,route:"Омск — Новосибирск (пример)",date:d,km:650,pay:24000,client:"jur",note:"Пример, удалите после просмотра",createdAt:Date.now()});
  [["fuel",5600,80,"Дизель, 2 заправки"],["food",900,0,"Обед"],["sleep",700,0,"Платная стоянка"]].forEach(([c,a,l,n],i)=>put(uid(),{kind:"exp",tripId:id,cat:c,amount:a,liters:l,note:n,createdAt:Date.now()+i}));
}

document.getElementById("addTrip").onclick=()=>tripForm();
document.getElementById("setBtn").onclick=settingsForm;
document.getElementById("prevM").onclick=()=>{cur.setMonth(cur.getMonth()-1);render()};
document.getElementById("nextM").onclick=()=>{cur.setMonth(cur.getMonth()+1);render()};
initStore();
</script>
